const $=s=>document.querySelector(s);let route=['home'],state={},checked=false;const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function go(...r){route=r;state={};checked=false;render();window.scrollTo(0,0)}function crumbs(){let names={home:'Acasă',math:'Matematică',llr:'LLR',add:'Adunare',sub:'Scădere',numer:'Numerație',ortho:'Ortograme',punct:'Punctuație',vocab:'Vocabular',match:'Asociază',similar:'Sens asemănător',gaps:'Completează',opposite:'Sens opus',sa:'sa / s-a',sau:'sau / s-au',comp:'printr-o, dintr-o, într-o',easy:'Pune semnele',hard:'Vindecă-te de virgulită'};return '<nav class="crumb">'+route.map((r,i)=>`<button onclick="go(${route.slice(0,i+1).map(x=>JSON.stringify(x)).join(',').replaceAll('"','&quot;')})">${names[r]||r}</button>${i<route.length-1?' › ':''}`).join('')+'</nav>'}
function card(title,desc,action){return `<button class="card" onclick="${esc(action)}"><strong>${title}</strong><small>${desc}</small></button>`}
function view(s){$('#app').innerHTML=crumbs()+s}function key(id){return 'v'+id}function setval(id,val){state[key(id)]=val;checked=false;let old=$('#score');if(old)old.remove()}function val(id){return state[key(id)]||''}function norm(s){return String(s).trim().toLocaleLowerCase('ro-RO').replace(/\s+/g,' ')}
function input(id,answer,placeholder='Răspuns'){let v=val(id);return `<input class="entry ${checked?(norm(v)===norm(answer)?'good':'bad'):''}" aria-label="Răspuns" placeholder="${placeholder}" value="${esc(v)}" oninput="setval('${id}',this.value)" data-id="${id}" data-answer="${esc(answer)}">`}
function actions(){return `<div class="row" style="margin-top:18px"><button class="btn" onclick="verify()">✓ Verifică răspunsurile</button><button class="btn alt" onclick="resetTask()">↺ Reîncearcă</button></div><div id="score" aria-live="polite"></div>`}
function verify(){checked=true;let inputs=[...document.querySelectorAll('[data-answer]')];let good=0;inputs.forEach(el=>{let ok=norm(el.value??el.dataset.value??'')===norm(el.dataset.answer);good+=ok?1:0;el.classList.toggle('good',ok);el.classList.toggle('bad',!ok)});$('#score').innerHTML=`<div class="result">${good} din ${inputs.length} răspunsuri corecte. ${good===inputs.length?'Bravo! 🌟':'Poți corecta răspunsurile și verifica din nou.'}</div>`}function resetTask(){state={};checked=false;render()}
function render(){let a=route[0],b=route[1],c=route[2];if(a==='home')return view(`<div class="hero"><h2>Bine ai venit! 👋</h2><p>Alege disciplina și exersează în ritmul tău.</p></div><div class="cards">${card('🔢 MATEMATICĂ','Numerație, adunare și scădere','go("math")')}${card('📚 LLR','Ortograme, punctuație și vocabular','go("llr")')}</div>`);if(a==='math'&&!b)return view(`<div class="hero"><h2>🔢 Matematică</h2><p>Alege lecția.</p></div><div class="cards">${card('🔎 Detectivii numerelor','Cele șapte lecții de numerație','go("math","numer")')}${card('➕ Adunarea până la 10 000','Cu trecere peste ordin • 6 tipuri de exerciții','go("math","add")')}${card('➖ Scăderea până la 10 000','Cu trecere peste ordin • 6 tipuri de exerciții','go("math","sub")')}</div>`);if(a==='math'&&b==='numer'){let html=decodeURIComponent(escape(atob(DATA.old)));let iframe=document.createElement('iframe');view('<div class="hero"><h2>🔎 Detectivii numerelor</h2><p>Lecțiile de numerație, păstrate din site-ul anterior.</p></div><div id="frame"></div>');iframe.title='Detectivii numerelor';iframe.srcdoc=html;$('#frame').appendChild(iframe);return}if(a==='math'&&(b==='add'||b==='sub'))return renderMath(b,c);if(a==='llr'&&!b)return view(`<div class="hero"><h2>📚 Limba și literatura română</h2><p>Alege ce vrei să exersezi.</p></div><div class="cards">${card('✍️ Ortograme','sa / s-a • sau / s-au • printr-o, dintr-o, într-o','go("llr","ortho")')}${card('💬 Punctuație','Completează sau elimină semnele greșite','go("llr","punct")')}${card('🌱 Vocabular','Descoperă și exersează cuvintele noi','go("llr","vocab")')}</div>`);if(a==='llr'&&b==='vocab')return renderVocab(c);if(a==='llr'&&b==='ortho')return renderOrtho(c,route[3]);if(a==='llr'&&b==='punct')return renderPunct(c,route[3]);}
const mathNames=['Calculează în coloană','Așază termenii unul sub altul','Completează tabelul','Mai mare / mai mic cu…','Alege rezultatul corect','Rezolvă problemele'];function renderMath(op,part){let sign=op==='add'?'+':'−',title=op==='add'?'Adunarea':'Scăderea',sets=DATA.math[op];if(!part)return view(`<div class="hero"><h2>${sign} ${title} numerelor până la 10 000</h2><p>Cu trecere peste ordin. Exercițiile sunt preluate din fișa ta.</p></div><div class="cards">${mathNames.map((t,i)=>card(`${i+1}. ${i===3?(op==='add'?'Află numărul mai mare':'Află numărul mai mic'):t}`,`${sets[i].length} exerciții`,`go('math','${op}','${i}')`)).join('')}</div>`);let n=+part,items=sets[n],body='';if(n===0||n===1){body=`<div class="grid5">${items.map(([x,y],i)=>`<div class="calc"><div class="vertical"><div>${x}</div><div class="bar">${sign} ${y}</div></div>${input(i,op==='add'?x+y:x-y)}</div>`).join('')}</div>`}else if(n===2){body=`<div class="grid5">${items.map(([x,y],i)=>`<div class="calc"><div>${op==='add'?'Termen':'Descăzut'}: <b>${x}</b></div><div>${op==='add'?'Termen':'Scăzător'}: <b>${y}</b></div><div>${op==='add'?'Sumă':'Diferență'}: ${input(i,op==='add'?x+y:x-y)}</div></div>`).join('')}</div>`}else if(n===3){body=items.map(([x,y],i)=>`<div class="task"><p>${String.fromCharCode(97+i)}) Află numărul mai ${op==='add'?'mare':'mic'} cu <b>${y}</b> decât <b>${x}</b>.</p>${input(i,op==='add'?x+y:x-y)}</div>`).join('')}else if(n===4){body=items.map(([x,y,options],i)=>`<div class="task"><p><b>${x} ${sign} ${y} = ?</b></p><div class="options">${options.map(z=>`<button class="option ${val(i)==z?'chosen':''}" onclick="choose('${i}','${z}')">${z}</button>`).join('')}</div><input type="hidden" data-id="${i}" data-answer="${op==='add'?x+y:x-y}" value="${esc(val(i))}"></div>`).join('')}else{body=items.map(([q,answer],i)=>`<div class="task"><p><b>${i+1}.</b> ${esc(q)}</p><label>Răspuns: ${input(i,answer)}</label></div>`).join('')}view(`<div class="hero"><div class="section-label">${title} • Exercițiul ${n+1}</div><h2>${mathNames[n]}</h2><p class="muted">Completează răspunsurile și apasă „Verifică”.</p></div><div class="panel">${body}${actions()}</div>`)}function choose(id,z){state[key(id)]=z;checked=false;render()}
const orthoNames={sa:'sa și s-a',sau:'sau și s-au',comp:'printr-o, printr-un, dintr-o, dintr-un, într-o, într-un'};const opts={sa:['sa','s-a'],sau:['sau','s-au'],comp:['printr-o','printr-un','dintr-o','dintr-un','într-o','într-un']};const rules={sa:'„sa” poate fi înlocuit cu „lui” sau „ei”. „s-a” apare când povestim o acțiune: s-a dus, s-a jucat.',sau:'„sau” poate fi înlocuit cu „ori”. „s-au” apare când povestim o acțiune: s-au dus, s-au jucat.',comp:'Toate se scriu cu cratimă. „printr-” arată trecerea prin ceva; „dintr-” arată de unde; „într-” arată unde sau când. Privește și cuvântul următor.'};
function renderOrtho(type,exercise){if(!type)return view(`<div class="hero"><h2>✍️ Ortograme</h2><p>Trei lecții. Fiecare are exerciții separate și un buton „Ajutor”.</p></div><div class="cards">${Object.keys(orthoNames).map(t=>card(orthoNames[t],'Alegere • text • transformare • greșeli',`go('llr','ortho','${t}')`)).join('')}</div>`);if(!exercise)return view(`<div class="hero"><h2>${orthoNames[type]}</h2><div class="rule"><b>REȚINE!</b><br>${rules[type]}</div></div><div class="cards">${card('1. Alege forma corectă','Selectează varianta potrivită',`go('llr','ortho','${type}','choose')`)}${card('2. Completează textul','Fiecare spațiu are propria căsuță',`go('llr','ortho','${type}','text')`)}${type!=='comp'?card('3. Transformă după model','Scrii doar grupul care se modifică',`go('llr','ortho','${type}','transform')`):''}${card(type==='comp'?'3. Detectivul greșelilor':'4. Detectivul greșelilor','Găsește enunțurile scrise corect',`go('llr','ortho','${type}','errors')`)}</div>`);let body='',data=DATA.ortho[type];if(exercise==='choose'){body=data.map(([sentence,answer],i)=>{let answers=answer.split('|');let pieces=sentence.split('___');return `<div class="task"><p><b>${i+1}.</b> ${pieces.map((p,j)=>esc(p)+(j<answers.length?` <select class="entry short" data-id="${i}_${j}" data-answer="${answers[j]}" onchange="setval('${i}_${j}',this.value)"><option value="">Alege</option>${opts[type].map(o=>`<option value="${o}" ${val(i+'_'+j)===o?'selected':''}>${o}</option>`).join('')}</select> `:'')).join('')}</p><button class="btn alt" onclick="hint('${i}')">💡 Ajutor</button><div id="hint${i}"></div></div>`}).join('')}else if(exercise==='text'){let [t,answers]=DATA.orthoTexts[type],parts=t.split('___');body=`<div class="task"><p style="line-height:2.8">${parts.map((p,i)=>esc(p)+(i<answers.length?` <select class="entry short" data-id="${i}" data-answer="${answers[i]}" onchange="setval('${i}',this.value)"><option value="">Alege</option>${opts[type].map(o=>`<option ${val(i)===o?'selected':''}>${o}</option>`).join('')}</select> `:'')).join('')}</p></div>`}else if(exercise==='transform'){body=DATA.transforms[type].map(([a,b,c,answer],i)=>`<div class="task"><p>${i+1}. ${a} <b>${b}</b> ${c}</p><div class="row">${a} ${input(i,answer,'Scrie doar schimbarea')} ${c}</div></div>`).join('')}else{body=DATA.errors[type].map(([sentence,ok],i)=>`<div class="task"><p>${i+1}. ${esc(sentence)}</p><div class="options">${[['Corect','da'],['Greșit','nu']].map(([label,v])=>`<button class="option ${val(i)===v?'chosen':''}" onclick="choose('${i}','${v}')">${label}</button>`).join('')}</div><input type="hidden" data-id="${i}" data-answer="${ok?'da':'nu'}" value="${val(i)}"></div>`).join('')}view(`<div class="hero"><div class="section-label">${orthoNames[type]}</div><h2>${{choose:'Alege forma corectă',text:'Completează textul',transform:'Transformă după model',errors:'Detectivul greșelilor'}[exercise]}</h2><button class="btn alt" onclick="hint('general')">💡 Ajutor</button><div id="hintgeneral"></div></div><div class="panel">${body}${actions()}</div>`)}function hint(i){let el=$('#hint'+i);if(el)el.innerHTML=el.innerHTML?'':`<div class="hint">${rules[route[2]]} Indiciu: încearcă înlocuirea cu „ori”, „lui” sau „ei”, unde este posibil.</div>`}
function renderPunct(level,idx){if(!level)return view(`<div class="hero"><h2>💬 Semne de punctuație</h2><p>Lucrăm direct pe text. Nu trebuie să rescrii nimic.</p></div><div class="cards">${card('🧩 Nivel simplu: Pune semnele corect','Alege semnul pentru fiecare căsuță','go("llr","punct","easy")')}${card('🩹 Nivel dificil: Vindecă-te de virgulită!','Taie semnele adăugate în plus, păstrează-le pe cele corecte','go("llr","punct","hard")')}</div>`);if(idx===undefined)return view(`<div class="hero"><h2>${level==='easy'?'🧩 Pune semnele corect':'🩹 Vindecă-te de virgulită!'}</h2><p>${level==='easy'?'Completează toate căsuțele.':'Apasă pe semnele inutile pentru a le tăia.'}</p></div><div class="cards">${DATA.punct.map(([name],i)=>card(`${i+1}. ${name}`,'Text din fișa de punctuație',`go('llr','punct','${level}','${i}')`)).join('')}</div>`);let [name,raw]=DATA.punct[+idx];let segments=raw.split(/\{([.,?!:—])\}/g),count=0,parts='';let extras=0;let words=0;for(let j=0;j<segments.length;j++){if(j%2===1){let mark=segments[j],id='p'+count++;if(level==='easy'){parts+=`<button class="slot ${val(id)?'filled':''}" onclick="fillPunct('${id}')" data-id="${id}" data-answer="${mark}" data-value="${esc(val(id))}" aria-label="Alege semnul de punctuație">${val(id)||'□'}</button>`}else{parts+=`<button class="punct ${val(id)==='cut'?'cut':''}" onclick="cutPunct('${id}')" data-id="${id}" data-answer="keep" data-value="${val(id)==='cut'?'cut':'keep'}" aria-label="Păstrează sau taie semnul">${mark}</button>`}}else{let text=segments[j];if(level==='hard'){let chunks=text.split(/(\s+)/);text=chunks.map((word,k)=>{if(!word.trim()||word==='\n')return esc(word);let result=esc(word);words++;if(words%7===3 && !/[.,?!:—]$/.test(word.trim())){let id='x'+extras++;result+=`<button class="punct ${val(id)==='cut'?'cut':''}" onclick="cutPunct('${id}')" data-id="${id}" data-answer="cut" data-value="${val(id)==='cut'?'cut':'keep'}" aria-label="Păstrează sau taie semnul">${words%2?',':'.'}</button>`}return result}).join('')}else text=esc(text);parts+=text}}
let toolbar=level==='easy'?`<div class="toolbar"><span class="muted">Semnul ales:</span>${['.',',','?','!',':','—'].map(m=>`<button class="tool ${state.tool===m?'active':''}" onclick="setTool('${m}')">${m}</button>`).join('')}<button class="tool" onclick="setTool('')">Șterge</button></div><p class="notice">Alege un semn de mai sus, apoi apasă pe căsuța din text.</p>`:`<p class="notice">Unele semne sunt corecte. Apasă doar pe cele care nu au ce căuta acolo. Apasă din nou pentru a anula tăierea.</p>`;
view(`<div class="hero"><div class="section-label">${level==='easy'?'Nivel simplu':'Nivel dificil'}</div><h2>${esc(name)}</h2></div><div class="panel">${toolbar}<div class="punct-text">${parts}</div>${actions()}</div>`)}function setTool(m){state.tool=m;document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('active',x.textContent===m))}function fillPunct(id){if(!state.tool){alert('Alege mai întâi semnul din bara de sus.');return}state[key(id)]=state.tool;let el=document.querySelector(`[data-id="${id}"]`);el.textContent=state.tool||'□';el.dataset.value=state.tool;el.classList.toggle('filled',!!state.tool);el.classList.remove('good','bad');$('#score').innerHTML=''}function cutPunct(id){state[key(id)]=val(id)==='cut'?'keep':'cut';let el=document.querySelector(`[data-id="${id}"]`);el.classList.toggle('cut',val(id)==='cut');el.dataset.value=val(id);el.classList.remove('good','bad');$('#score').innerHTML=''}

function vinput(i,answer){return `<input class="entry" style="min-width:165px;max-width:260px" data-id="${i}" data-answer="${esc(answer)}" value="${esc(val(i))}" oninput="setval('${i}',this.value)" placeholder="Scrie aici" autocomplete="off">`}
function vocabVerify(){let els=[...document.querySelectorAll('[data-answer]')],good=0;els.forEach(el=>{let a=el.dataset.answer.split('|').map(norm),v=norm(el.value);let ok=a.includes(v);good+=ok?1:0;el.classList.toggle('good',ok);el.classList.toggle('bad',!ok)});$('#score').innerHTML=`<div class="result">${good} din ${els.length} răspunsuri corecte. ${good===els.length?'Excelent! 🌟':'Mai încearcă! Poți modifica răspunsurile.'}</div>`}
function vocabActions(){return `<div class="row" style="margin-top:18px"><button class="btn" onclick="vocabVerify()">✓ Verifică</button><button class="btn alt" onclick="resetTask()">↺ Reîncearcă</button></div><div id="score" aria-live="polite"></div>`}
function vocabHelp(i){let e=$('#vh'+i);e.innerHTML=e.innerHTML?'':'<div class="hint">Citește propoziția întreagă. Gândește-te la sensul cuvântului și la forma potrivită în enunț.</div>'}
function renderVocab(level){
if(!level)return view(`<div class="hero"><h2>🌱 Vocabular</h2><p>17 cuvinte noi • exersează pe niveluri, fără să rescrii propozițiile.</p><div class="rule"><b>REȚINE!</b> Cuvintele cu sens asemănător exprimă idei apropiate. Cuvintele cu sens opus exprimă idei contrare.</div></div><div class="cards">${card('1. Găsește perechea','Asociază fiecare cuvânt cu sensul apropiat','go("llr","vocab","match")')}${card('2. Scrie cuvinte cu sens asemănător','Scrie doar cuvântul potrivit','go("llr","vocab","similar")')}${card('3. Completează propozițiile','Folosește cuvintele noi în context','go("llr","vocab","gaps")')}${card('⭐ Bonus: Cuvinte cu sens opus','Găsește contrariul acolo unde este posibil','go("llr","vocab","opposite")')}</div>`);
let body='',title='',notice='';
if(level==='match'){title='Nivelul 1 – Găsește perechea';notice='Alege cuvântul cu sens asemănător din lista amestecată.';let opts=[...VOCAB.map(x=>x[1])].sort((a,b)=>a.localeCompare(b,'ro'));body=VOCAB.map((v,i)=>`<div class="task"><label><b>${i+1}. ${esc(v[0])}</b> → <select class="entry" data-id="${i}" data-answer="${esc(v[1])}" onchange="setval('${i}',this.value)"><option value="">Alege perechea</option>${opts.map(o=>`<option value="${esc(o)}" ${val(i)===o?'selected':''}>${esc(o)}</option>`).join('')}</select></label></div>`).join('')}
if(level==='similar'){title='Nivelul 2 – Sens asemănător';notice='Scrie un cuvânt cu sens asemănător. Nu trebuie să scrii propoziții.';body=VOCAB.map((v,i)=>`<div class="task"><b>${i+1}. ${esc(v[0])}</b> → ${vinput(i,v[1])}</div>`).join('')}
if(level==='gaps'){title='Nivelul 3 – Completează propozițiile';notice='Scrie numai cuvântul lipsă, la forma potrivită. Apasă „Ajutor” dacă ai nevoie de un indiciu.';body=VOCAB_GAPS.map(([q,a],i)=>`<div class="task"><p><b>${i+1}.</b> ${esc(q)}</p>${vinput(i,a)} <button class="btn alt" onclick="vocabHelp(${i})">💡 Ajutor</button><div id="vh${i}"></div></div>`).join('')}
if(level==='opposite'){title='Bonus – Cuvinte cu sens opus';notice='Scrie un cuvânt cu sens opus. Am ales doar cuvintele pentru care există un contrast clar.';body=VOCAB.filter(v=>v[2]).map((v,i)=>`<div class="task"><b>${i+1}. ${esc(v[0])}</b> → ${vinput(i,v[2])}</div>`).join('')}
view(`<div class="hero"><h2>${title}</h2><p>${notice}</p></div><div class="panel">${body}${vocabActions()}</div>`)
}
