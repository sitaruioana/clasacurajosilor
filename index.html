<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detectivii numerelor • Probleme la numerație</title><style>
:root{--ink:#26364b;--blue:#346bb4;--mint:#e5f6ee;--yellow:#fff0a6;--paper:#fffdf8;--line:#dce4ee;--rose:#fff0e9}*{box-sizing:border-box}body{margin:0;background:#f1f5fa;color:var(--ink);font:17px/1.55 system-ui,-apple-system,'Segoe UI',sans-serif}header{background:linear-gradient(115deg,#265e9f,#528cc3);color:white;padding:32px max(24px,calc((100vw - 1120px)/2));}header h1{margin:0;font-size:clamp(27px,4vw,42px);line-height:1.15}header p{margin:9px 0 0;color:#eef7ff}.shell{max-width:1120px;margin:24px auto;display:grid;grid-template-columns:255px minmax(0,1fr);gap:22px;padding:0 18px}.sidebar{background:white;border:1px solid var(--line);border-radius:18px;padding:15px;align-self:start;position:sticky;top:15px}.sidebar h2{font-size:15px;margin:0 0 12px;color:#65768b}.nav{width:100%;border:0;border-radius:10px;text-align:left;background:transparent;color:#344760;font:inherit;font-size:14px;padding:12px;cursor:pointer}.nav:hover{background:#eff5fb}.nav.active{background:#dfeefe;color:#1e5799;font-weight:750}.panel{background:white;border:1px solid var(--line);border-radius:20px;padding:clamp(20px,4vw,36px);box-shadow:0 8px 28px #26364b0a}.eyebrow{color:#457bb5;font-weight:750;font-size:13px;letter-spacing:.08em;text-transform:uppercase}.panel h2{font-size:clamp(23px,3vw,31px);line-height:1.2;margin:8px 0 23px}.sub{font-weight:800;color:#3268a8;margin:26px 0 9px;font-size:16px}.example{border:1px solid #cde0f5;border-radius:15px;padding:17px;background:#f7fbff}.example strong{display:block;margin-bottom:9px}.example p{margin:7px 0}.remember{border-left:6px solid #e8bb3d;background:#fff9db;padding:17px 20px;border-radius:12px;margin-top:22px}.remember h3{margin:0 0 7px;font-size:17px}.formula{background:var(--yellow);padding:7px 10px;display:inline-block;border-radius:7px;font-weight:800;margin-top:10px}.problem{border:1px solid var(--line);border-radius:13px;padding:15px;margin:12px 0;background:var(--paper)}.problem label{display:block;font-weight:650;margin-bottom:10px}.problem input{width:170px;max-width:100%;border:2px solid #cbd7e4;border-radius:9px;padding:10px;font:inherit;background:white}.problem input:focus{outline:3px solid #b6d9ff;border-color:#4a83c2}.feedback{margin-left:12px;font-weight:700;font-size:14px}.correct{color:#19734d}.wrong{color:#b44c3b}.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}button.action{border:0;background:#326fb4;color:white;border-radius:10px;padding:11px 17px;font:inherit;font-weight:750;cursor:pointer}button.secondary{background:#e7f0fb;color:#255e9e}.counter{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:16px 0}.number{width:54px;height:54px;display:grid;place-items:center;border:2px solid #9bc0e6;background:#e7f1ff;border-radius:11px;font-weight:800;font-size:22px}.arrow{color:#ba802b;font-size:23px;font-weight:800}.count-label{text-align:center;color:#51745e;font-weight:750;font-size:14px}.place{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:540px;margin:12px 0}.place div{text-align:center;border:1px solid #c8d9e9;border-radius:10px;padding:10px 5px;background:#edf5fd}.place b{display:block;font-size:20px;color:#2e689f}.note{font-size:14px;color:#627287}.progress{font-size:14px;color:#66778c;margin-top:12px}.end{margin:18px 0 0;font-size:13px;color:#6e7f91}@media(max-width:760px){.shell{display:block}.sidebar{position:static;margin-bottom:15px}.sidebar nav{display:flex;overflow:auto;gap:6px}.nav{min-width:175px}.panel{padding:21px}.feedback{display:block;margin:7px 0 0}}@media print{header,.sidebar,.controls{display:none}.shell{display:block}.panel{border:0;box-shadow:none}.problem input{border:0;border-bottom:1px solid #333;border-radius:0}}
</style></head><body><header><h1>🔎 Detectivii numerelor</h1><p>Descoperă regula, urmărește exemplul și rezolvă singur! • Clasa a III-a</p></header><div class="shell"><aside class="sidebar"><h2>ALEGE O LECȚIE</h2><nav id="nav"></nav><div class="progress" id="progress"></div></aside><main class="panel" id="content" aria-live="polite"></main></div><script>
const lessons=[
{id:'1A',title:'Numere consecutive',question:'Câte numere consecutive sunt de la 12 la 17, inclusiv?',steps:['Pornim numărătorul de la 12 și numărăm fiecare număr până la 17.','Numărătorul arată 6 numere.','Calculăm mai repede: 17 − 12 + 1 = 6 numere.'],visual:'counter',remember:'Când numerele sunt consecutive, ele cresc din 1 în 1. Scădem numărul mic din numărul mare și adăugăm 1, fiindcă îl numărăm și pe cel de la care pornim.',formula:'Numărul de numere = numărul mare − numărul mic + 1',problems:[['Câte numere consecutive sunt de la 24 la 39, inclusiv?',16],['Câte numere consecutive sunt de la 108 la 125, inclusiv?',18],['Câte numere consecutive sunt de la 1 250 la 1 300, inclusiv?',51]]},
{id:'1B',title:'Șiruri cu pas',question:'Câți termeni are șirul 12, 17, 22, …, 97?',steps:['Observăm: 17 − 12 = 5. Numărăm din 5 în 5.','Într-un șir mai scurt avem 4 numere, dar numai 3 sărituri.','De la 12 la 97 sunt 97 − 12 = 85 de unități.','Împărțim 85 : 5 = 17 sărituri. Numărăm și primul număr: 17 + 1 = 18 numere.'],visual:'jumps',remember:'Numărăm săriturile și adăugăm 1, fiindcă primul număr nu este o săritură.',formula:'Numărul de termeni = (ultimul − primul) : pas + 1',problems:[['Câți termeni are șirul 8, 14, 20, …, 98?',16],['Câți termeni are șirul 1 000, 1 004, 1 008, …, 1 096?',25],['Câți termeni are șirul 5, 12, 19, …, 96?',14]]},
{id:'2',title:'Numerotarea paginilor: câte cifre?',question:'Câte cifre se folosesc pentru numerotarea unei cărți cu 120 de pagini?',steps:['Paginile 1–9: 9 × 1 = 9 cifre.','Paginile 10–99: 90 × 2 = 180 de cifre.','Paginile 100–120: 21 × 3 = 63 de cifre.','În total: 9 + 180 + 63 = 252 de cifre.'],remember:'Paginile de la 1 la 9 au o cifră; cele de la 10 la 99 au două cifre; de la 100 încep paginile cu trei cifre. Numărăm separat fiecare grup.',formula:'Total cifre = cifre pentru pagini de 1 cifră + de 2 cifre + de 3 cifre',problems:[['Câte cifre sunt necesare pentru numerotarea unui caiet cu 60 de pagini?',111],['Câte cifre sunt necesare pentru numerotarea unei cărți cu 105 pagini?',207],['Câte cifre sunt necesare pentru numerotarea unei cărți cu 150 de pagini?',342]]},
{id:'2B',title:'Numerotarea paginilor: câte pagini?',question:'Pentru numerotarea unei cărți s-au folosit 255 de cifre. Câte pagini are cartea?',steps:['Paginile 1–9 folosesc 9 cifre.','Paginile 10–99 folosesc 90 × 2 = 180 de cifre.','Primele 99 de pagini folosesc 9 + 180 = 189 de cifre.','Rămân 255 − 189 = 66 de cifre pentru paginile de trei cifre.','66 : 3 = 22 de pagini. În total: 99 + 22 = 121 de pagini.'],remember:'Scădem din total cele 189 de cifre folosite pentru paginile 1–99. Împărțim cifrele rămase la 3, apoi adăugăm cele 99 de pagini.',formula:'Număr pagini = 99 + (număr total de cifre − 189) : 3',problems:[['Pentru numerotarea unei cărți s-au folosit 225 de cifre. Câte pagini are cartea?',111],['Pentru numerotarea unei cărți s-au folosit 279 de cifre. Câte pagini are cartea?',129],['Pentru numerotarea unei cărți s-au folosit 348 de cifre. Câte pagini are cartea?',152]]},
{id:'3',title:'Strângeri de mână și perechi',question:'6 prieteni dau mâna fiecare cu fiecare, o singură dată. Câte strângeri de mână sunt?',steps:['Primul dă mâna cu 5 prieteni, al doilea cu încă 4, apoi 3, 2 și 1.','Calculăm: 5 + 4 + 3 + 2 + 1 = 15 strângeri de mână.'],remember:'Numărăm fiecare pereche o singură dată. Fiecare persoană se întâlnește cu celelalte, dar nu numărăm aceeași strângere de mână de două ori.',formula:'Pentru n persoane: (n − 1) + (n − 2) + … + 2 + 1',problems:[['La o petrecere sunt 8 copii. Fiecare dă mâna cu fiecare o singură dată. Câte strângeri de mână sunt?',28],['Din 5 culori de baloane alegem două culori diferite. În câte moduri putem alege?',10],['6 elevi joacă șah, fiecare cu fiecare, o singură partidă. Câte partide se joacă?',15]]},
{id:'4A',title:'Formarea numerelor: cifre diferite',question:'Câte numere de 4 cifre diferite se pot forma cu cifrele 3, 0, 5, 8?',steps:['Miile (M): 3 posibilități – 3, 5 sau 8. Nu putem pune 0 pe prima poziție.','Sutele (S): 3 posibilități – au rămas trei cifre nefolosite.','Zecile (Z): 2 posibilități. Unitățile (U): 1 posibilitate.','Total: 3 × 3 × 2 × 1 = 18 numere.'],visual:'places',remember:'Un număr de patru cifre are: mii (M), sute (S), zeci (Z) și unități (U). Prima cifră nu poate fi 0. Dacă se cer cifre diferite, o cifră aleasă nu mai poate fi folosită.',formula:'Numărăm posibilitățile pentru M, S, Z, U și le înmulțim.',problems:[['Câte numere de 3 cifre diferite se pot forma cu cifrele 1, 4, 7?',6],['Câte numere de 4 cifre diferite se pot forma cu cifrele 1, 0, 6, 9?',18],['Câte numere de 4 cifre diferite se pot forma cu cifrele 2, 4, 5, 7?',24]]},
{id:'4B',title:'Formarea numerelor: cifre pare și impare',question:'Câte numere de 3 cifre au numai cifre impare?',steps:['Cifre impare: 1, 3, 5, 7, 9. Avem 5 posibilități pentru fiecare poziție.','Sutele (S): 5 posibilități. Zecile (Z): 5. Unitățile (U): 5.','Total: 5 × 5 × 5 = 125 de numere.'],remember:'Cifre pare: 0, 2, 4, 6, 8. Cifre impare: 1, 3, 5, 7, 9. Dacă nu scrie „cifre diferite”, cifrele se pot repeta. De exemplu, 111 este un număr cu trei cifre impare. Atenție! La numerele formate numai din cifre pare, 0 nu poate ocupa poziția sutelor sau a miilor.',formula:'Înmulțim posibilitățile pentru fiecare poziție; prima cifră nu poate fi 0.',problems:[['Câte numere de 3 cifre au numai cifre pare?',100],['Câte numere de 3 cifre au numai cifre impare?',125],['Câte numere de 4 cifre au numai cifre pare?',500]]}
];
let current=0;const answers={};const completed=new Set();const nav=document.getElementById('nav'),content=document.getElementById('content');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function draw(){nav.innerHTML=lessons.map((l,i)=>`<button class="nav ${i===current?'active':''}" onclick="openLesson(${i})">${completed.has(i)?'✓ ':''}${esc(l.id)} · ${esc(l.title)}</button>`).join('');document.getElementById('progress').textContent=`${completed.size} din ${lessons.length} lecții rezolvate corect`;const l=lessons[current];let visual='';if(l.visual==='counter'){visual=`<div class="counter">${[12,13,14,15,16,17].map((n,i)=>`<span class="number" title="Al ${i+1}-lea număr">${n}</span>`).join('')}</div><div class="count-label">Numărător: 1, 2, 3, 4, 5, 6 → 6 numere</div>`}if(l.visual==='jumps'){visual=`<div class="counter">${[12,17,22,27].map((n,i)=>`${i?'<span class="arrow">+5 →</span>':''}<span class="number">${n}</span>`).join('')}</div><div class="count-label">4 numere • 3 sărituri</div>`}if(l.visual==='places'){visual=`<div class="place">${[['M',3],['S',3],['Z',2],['U',1]].map(([k,v])=>`<div>${k}<b>${v}</b>posibilități</div>`).join('')}</div>`}content.innerHTML=`<div class="eyebrow">Fișa ${esc(l.id)} · Lecția ${current+1} din ${lessons.length}</div><h2>${esc(l.title)}</h2><div class="sub">✏️ EXEMPLU REZOLVAT</div><div class="example"><strong>${esc(l.question)}</strong>${l.steps.map(s=>`<p>${esc(s)}</p>`).join('')}${visual}</div><div class="remember"><h3>💡 REȚINE!</h3><div>${esc(l.remember)}</div><div class="formula">${esc(l.formula)}</div></div><div class="sub">🎯 EXERSEAZĂ! Rezolvă cele trei probleme.</div>${l.problems.map((p,i)=>`<div class="problem"><label for="a${i}">${i+1}. ${esc(p[0])}</label><input id="a${i}" type="text" inputmode="numeric" autocomplete="off" placeholder="Răspunsul tău" value="${esc(answers[current+'-'+i]||'')}" oninput="answers['${current}-'+${i}]=this.value"><span class="feedback" id="f${i}" aria-live="polite"></span></div>`).join('')}<div class="controls"><button class="action" onclick="check()">✓ Verifică răspunsurile</button><button class="action secondary" onclick="resetLesson()">↻ Încearcă din nou</button><button class="action secondary" onclick="next()">Lecția următoare →</button></div><p class="note">Scrie doar numărul, fără unități. Poți reveni la o lecție oricând.</p>`}function openLesson(i){current=i;draw();window.scrollTo({top:0,behavior:'smooth'})}function check(){let ok=0;lessons[current].problems.forEach((p,i)=>{let raw=(answers[current+'-'+i]||'').replace(/\s/g,'');let good=raw!==''&&Number(raw)===p[1];let el=document.getElementById('f'+i);el.className='feedback '+(good?'correct':'wrong');el.textContent=good?'✓ Corect!':'↻ Mai încearcă!';if(good)ok++});if(ok===3){completed.add(current);draw();lessons[current].problems.forEach((p,i)=>{let e=document.getElementById('f'+i);e.className='feedback correct';e.textContent='✓ Corect!'});}}function resetLesson(){lessons[current].problems.forEach((_,i)=>delete answers[current+'-'+i]);completed.delete(current);draw()}function next(){openLesson((current+1)%lessons.length)}draw();
</script></body></html>
