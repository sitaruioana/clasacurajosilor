const SITE_ROOT='/clasacurajosilor/';
function pathForRoute(r){for(const [p,v] of Object.entries(FRIENDLY_ROUTES)){if(JSON.stringify(v)===JSON.stringify(r))return SITE_ROOT+(p?p+'/':'');}return null;}
function routeFromPath(){let path=decodeURIComponent(location.pathname);let relative=path.startsWith(SITE_ROOT)?path.slice(SITE_ROOT.length):'';relative=relative.replace(/\/index\.html$/,'').replace(/\/$/,'');return FRIENDLY_ROUTES[relative]||['home'];}
function navigateHistory(r){let p=pathForRoute(r);if(p&&location.pathname!==p)history.pushState({route:r},'',p);}

function crumbs(){let names={home:'Acasă',math:'Matematică',llr:'LLR',science:'Științe',add:'Adunare',sub:'Scădere',numer:'Numerație',unknown:'Numărul necunoscut',first:'Primul termen',second:'Al doilea termen',minuend:'Descăzutul',subtrahend:'Scăzătorul',mixed:'Combinat',easy:'Ușor',medium:'Mediu',hard:'Dificil',advanced:'Avansat',ortho:'Ortograme',punct:'Punctuație',vocab:'Vocabular',match:'Asociază',similar:'Sens asemănător',gaps:'Completează',opposite:'Sens opus',sa:'sa / s-a',sau:'sau / s-au',comp:'printr-o, dintr-o, într-o',easy:'Pune semnele',hard:'Vindecă-te de virgulită'};return '<nav class="crumb">'+route.map((r,i)=>`<button onclick="go(${route.slice(0,i+1).map(x=>JSON.stringify(x)).join(',').replaceAll('"','&quot;')})">${names[r]||r}</button>${i<route.length-1?' › ':''}`).join('')+'</nav>'}
function card(title,desc,action){return `<button class="card" onclick="${esc(action)}"><strong>${title}</strong><small>${desc}</small></button>`}
function view(s){$('#app').innerHTML=crumbs()+s;let back=document.getElementById('site-back');if(back)back.disabled=route.length<=1}function key(id){return 'v'+id}function setval(id,val){diplomaReadyFor='';state[key(id)]=val;saveProgress();checked=false;let old=$('#score');if(old)old.remove()}function val(id){return state[key(id)]||''}function norm(s){return String(s).trim().toLocaleLowerCase('ro-RO').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[șş]/g,'s').replace(/[țţ]/g,'t').replace(/\s+/g,' ')}
function input(id,answer,placeholder='Răspuns'){let v=val(id);return `<input class="entry ${checked?(norm(v)===norm(answer)?'good':'bad'):''}" aria-label="Răspuns" placeholder="${placeholder}" value="${esc(v)}" oninput="setval('${id}',this.value)" data-id="${id}" data-answer="${esc(answer)}">`}
function actions(){return `<div class="row" style="margin-top:18px"><button class="btn" onclick="verify()">✓ Verifică răspunsurile</button><button class="btn alt" onclick="resetTask()">↺ Reîncearcă</button></div><div id="score" aria-live="polite"></div>`}
function verify(){checked=true;let inputs=[...document.querySelectorAll('[data-answer]')];let good=0;inputs.forEach(el=>{let ok=norm(el.tagName==='BUTTON' ? (el.classList.contains('punct') ? (el.classList.contains('cut') ? 'cut' : 'keep') : el.dataset.value) : el.value)===norm(el.dataset.answer);good+=ok?1:0;el.classList.toggle('good',ok);el.classList.toggle('bad',!ok)});$('#score').innerHTML=`<div class="result">${good} din ${inputs.length} răspunsuri corecte. ${good===inputs.length&&inputs.length?'Bravo! 🌟':'Poți corecta răspunsurile și verifica din nou.'}</div>`+(good===inputs.length&&inputs.length?certificateUnlock():'')}function resetTask(){if(!confirm('Ștergi răspunsurile din acest exercițiu și începi din nou?'))return;diplomaReadyFor='';state={};saveProgress();checked=false;render()}
function render(){let a=route[0],b=route[1],c=route[2];if(a==='home')return view(`<div class="hero"><h2>Bine ai venit! 👋</h2><p>Alege disciplina și exersează în ritmul tău.</p></div><div class="cards">${card('🔢 MATEMATICĂ','Numerație, adunare și scădere','go("math")')}${card('📚 LLR','Ortograme, punctuație și vocabular','go("llr")')}${card('🔬 ȘTIINȚE ALE NATURII','Micul laborator de științe • 8 experimente','go("science")')}</div>`);if(a==='science')return renderScience(b);if(a==='math'&&!b)return view(`<div class="hero"><h2>🔢 Matematică</h2><p>Alege lecția.</p></div><div class="cards">${card('➕ Adunarea până la 10 000','Cu trecere peste ordin • 6 tipuri de exerciții','go("math","add")')}${card('➖ Scăderea până la 10 000','Cu trecere peste ordin • 6 tipuri de exerciții','go("math","sub")')}${card('❓ Aflarea numărului necunoscut','Termen, descăzut, scăzător • 4 niveluri','go("math","unknown")')}${card('🔎 Detectivii numerelor','Performanță – Cele șapte lecții de numerație','go("math","numer")')}</div>`);if(a==='math'&&b==='unknown')return renderUnknown(c,route[3]);if(a==='math'&&b==='numer'){let html=decodeURIComponent(escape(atob(DATA.old)));let iframe=document.createElement('iframe');view('<div class="hero"><h2>🔎 Detectivii numerelor</h2><p>Lecțiile de numerație, păstrate din site-ul anterior.</p></div><div id="frame"></div>');iframe.title='Detectivii numerelor';iframe.srcdoc=html;$('#frame').appendChild(iframe);return}if(a==='math'&&(b==='add'||b==='sub'))return renderMath(b,c);if(a==='llr'&&!b)return view(`<div class="hero"><h2>📚 Limba și literatura română</h2><p>Alege ce vrei să exersezi.</p></div><div class="cards">${card('✍️ Ortograme','sa / s-a • sau / s-au • printr-o, dintr-o, într-o','go("llr","ortho")')}${card('💬 Punctuație','Completează sau elimină semnele greșite','go("llr","punct")')}${card('🌱 Vocabular','Descoperă și exersează cuvintele noi','go("llr","vocab")')}</div>`);if(a==='llr'&&b==='vocab')return renderVocab(c);if(a==='llr'&&b==='ortho')return renderOrtho(c,route[3]);if(a==='llr'&&b==='punct')return renderPunct(c,route[3]);}

const UNKNOWN_TYPES={first:['Primul termen','□ +  = '],second:['Al doilea termen',' + □ = '],minuend:['Descăzutul','□ −  = '],subtrahend:['Scăzătorul',' − □ = '],mixed:['Exerciții combinate','Află numărul lipsă']};
const UNKNOWN_LEVELS={easy:['🟢 Ușor','Alege răspunsul corect din trei variante simple.'],medium:['🟡 Mediu','Calculează și scrie numărul necunoscut.'],hard:['🟠 Dificil','Citește cu atenție problemele și găsește numărul.'],advanced:['🔴 Avansat','Mai întâi calculează o altă operație, apoi află numărul necunoscut.']};
function unknownProblems(type,level){
 const types=type==='mixed'?['first','second','minuend','subtrahend','second','subtrahend','first','minuend']:Array(8).fill(type);
 return types.map((kind,i)=>{
  const a=1260+((i*347+kind.length*109)%2600),b=410+((i*163+kind.length*67)%950),sum=a+b,diff=a-b;
  const missing=kind==='first'?a:kind==='second'?b:kind==='minuend'?a: b;
  const expression={first:`□ + ${b} = ${sum}`,second:`${a} + □ = ${sum}`,minuend:`□ − ${b} = ${diff}`,subtrahend:`${a} − □ = ${diff}`}[kind];
  let question=expression,answer=missing,tip='';
  if(level==='hard'){
   const stories={first:`Mă gândesc la un număr. Îi adaug ${b} și obțin ${sum}. La ce număr m-am gândit?`,second:`Mă gândesc la un număr. Dacă îl adaug la ${a}, obțin ${sum}. Care este numărul?`,minuend:`Mă gândesc la un număr. Dacă scad ${b} din el, obțin ${diff}. Care este numărul?`,subtrahend:`Dacă scad un număr din ${a}, obțin ${diff}. Ce număr am scăzut?`};question=stories[kind];tip='Scrie mai întâi egalitatea cu numărul necunoscut.';
  }
  if(level==='advanced'){
   const x=220+i*37,y=140+i*19,aux=x+y;
   if(kind==='first'){question=`Un număr necunoscut adunat cu suma numerelor ${x} și ${y} dă ${a+aux}. Află numărul necunoscut.`;answer=a;tip='Mai întâi află suma numerelor cunoscute, apoi primul termen.'}
   if(kind==='second'){question=`La numărul ${a} se adaugă un număr necunoscut. Suma obținută este egală cu ${sum-aux} + (${x} + ${y}). Află numărul necunoscut.`;answer=b;tip='Calculează întâi expresia din partea dreaptă.'}
   if(kind==='minuend'){question=`Dintr-un număr necunoscut scad diferența numerelor ${x+300} și ${y}. Obțin ${a-(x+300-y)}. Află numărul necunoscut.`;answer=a;tip='Află mai întâi diferența cunoscută.'}
   if(kind==='subtrahend'){question=`Din ${a} scad un număr necunoscut și obțin suma numerelor ${diff-x} și ${x}. Află numărul scăzut.`;answer=b;tip='Calculează mai întâi suma din enunț.'}
  }
  return {question,answer,expression,tip,kind};
 });
}
function renderUnknown(type,level){
 if(!type)return view(`<div class="hero"><h2>❓ Aflarea numărului necunoscut</h2><p>Exersează aflarea termenilor, a descăzutului și a scăzătorului. Alege ce dorești să lucrezi.</p></div><div class="cards">${Object.entries(UNKNOWN_TYPES).map(([k,v])=>card(v[0],k==='mixed'?'Toate tipurile amestecate':'Exerciții cu numărul lipsă',`go('math','unknown','${k}')`)).join('')}</div><div class="rule"><b>Reține!</b> Pentru a afla un termen, scazi din sumă termenul cunoscut. Pentru a afla descăzutul, aduni diferența cu scăzătorul. Pentru a afla scăzătorul, scazi diferența din descăzut.</div>`);
 if(!level)return view(`<div class="hero"><h2>${UNKNOWN_TYPES[type][0]}</h2><p>Alege nivelul. Poți reveni oricând, răspunsurile se salvează automat.</p></div><div class="cards">${Object.entries(UNKNOWN_LEVELS).map(([k,v])=>card(v[0],v[1],`go('math','unknown','${type}','${k}')`)).join('')}</div>`);
 const problems=unknownProblems(type,level);
 let body=problems.map((p,i)=>{let entry=level==='easy'?`<div class="options">${[p.answer+1000,p.answer,p.answer+2000].sort((a,b)=>((a*17+i*13)%7)-((b*17+i*13)%7)).map(n=>`<button type="button" class="option ${val(i)==n?'chosen':''}" onclick="choose('${i}','${n}')">${n}</button>`).join('')}</div><input type="hidden" data-id="${i}" data-answer="${p.answer}" value="${esc(val(i))}">`:input(i,p.answer,'Numărul necunoscut');return `<div class="task"><p><b>${i+1}.</b> ${esc(p.question)}</p>${entry}${p.tip?`<details><summary>💡 Indiciu</summary><p>${esc(p.tip)}</p></details>`:''}</div>`}).join('');
 view(`<div class="hero"><div class="section-label">${UNKNOWN_TYPES[type][0]} · ${UNKNOWN_LEVELS[level][0]}</div><h2>Află numărul necunoscut</h2><p>${UNKNOWN_LEVELS[level][1]} Sunt 8 exerciții. Poți corecta și verifica din nou până obții 100%.</p></div><div class="panel">${body}${actions()}</div>`);
}

const mathNames=['Calculează în coloană','Așază termenii unul sub altul','Completează tabelul','Mai mare / mai mic cu…','Alege rezultatul corect','Rezolvă problemele'];function renderMath(op,part){let sign=op==='add'?'+':'−',title=op==='add'?'Adunarea':'Scăderea',sets=DATA.math[op];if(!part)return view(`<div class="hero"><h2>${sign} ${title} numerelor până la 10 000</h2><p>Cu trecere peste ordin. Exercițiile sunt preluate din fișa ta.</p></div><div class="cards">${mathNames.map((t,i)=>card(`${i+1}. ${i===3?(op==='add'?'Află numărul mai mare':'Află numărul mai mic'):t}`,`${sets[i].length} exerciții`,`go('math','${op}','${i}')`)).join('')}</div>`);let n=+part,items=sets[n],body='';if(n===0||n===1){body=`<div class="grid5">${items.map(([x,y],i)=>`<div class="calc"><div class="vertical"><div>${x}</div><div class="bar">${sign} ${y}</div></div>${input(i,op==='add'?x+y:x-y)}</div>`).join('')}</div>`}else if(n===2){body=`<div class="grid5">${items.map(([x,y],i)=>`<div class="calc"><div>${op==='add'?'Termen':'Descăzut'}: <b>${x}</b></div><div>${op==='add'?'Termen':'Scăzător'}: <b>${y}</b></div><div>${op==='add'?'Sumă':'Diferență'}: ${input(i,op==='add'?x+y:x-y)}</div></div>`).join('')}</div>`}else if(n===3){body=items.map(([x,y],i)=>`<div class="task"><p>${String.fromCharCode(97+i)}) Află numărul mai ${op==='add'?'mare':'mic'} cu <b>${y}</b> decât <b>${x}</b>.</p>${input(i,op==='add'?x+y:x-y)}</div>`).join('')}else if(n===4){body=items.map(([x,y,options],i)=>`<div class="task"><p><b>${x} ${sign} ${y} = ?</b></p><div class="options">${options.map(z=>`<button class="option ${val(i)==z?'chosen':''}" onclick="choose('${i}','${z}')">${z}</button>`).join('')}</div><input type="hidden" data-id="${i}" data-answer="${op==='add'?x+y:x-y}" value="${esc(val(i))}"></div>`).join('')}else{body=items.map(([q,answer],i)=>`<div class="task"><p><b>${i+1}.</b> ${esc(q)}</p><label>Răspuns: ${input(i,answer)}</label></div>`).join('')}view(`<div class="hero"><div class="section-label">${title} • Exercițiul ${n+1}</div><h2>${mathNames[n]}</h2><p class="muted">Completează răspunsurile și apasă „Verifică”.</p></div><div class="panel">${body}${actions()}</div>`)}function choose(id,z){diplomaReadyFor='';state[key(id)]=z;saveProgress();checked=false;render()}
const orthoNames={sa:'sa și s-a',sau:'sau și s-au',comp:'printr-o, printr-un, dintr-o, dintr-un, într-o, într-un'};const opts={sa:['sa','s-a'],sau:['sau','s-au'],comp:['printr-o','printr-un','dintr-o','dintr-un','într-o','într-un']};const rules={sa:'„sa” poate fi înlocuit cu „lui” sau „ei”. „s-a” apare când povestim o acțiune: s-a dus, s-a jucat.',sau:'„sau” poate fi înlocuit cu „ori”. „s-au” apare când povestim o acțiune: s-au dus, s-au jucat.',comp:'Toate se scriu cu cratimă. „printr-” arată trecerea prin ceva; „dintr-” arată de unde; „într-” arată unde sau când. Privește și cuvântul următor.'};
function renderOrtho(type,exercise){if(!type)return view(`<div class="hero"><h2>✍️ Ortograme</h2><p>Trei lecții. Fiecare are exerciții separate și un buton „Ajutor”.</p></div><div class="cards">${Object.keys(orthoNames).map(t=>card(orthoNames[t],'Alegere • text • transformare • greșeli',`go('llr','ortho','${t}')`)).join('')}</div>`);if(!exercise)return view(`<div class="hero"><h2>${orthoNames[type]}</h2><div class="rule"><b>REȚINE!</b><br>${rules[type]}</div></div><div class="cards">${card('1. Alege forma corectă','Selectează varianta potrivită',`go('llr','ortho','${type}','choose')`)}${card('2. Completează textul','Fiecare spațiu are propria căsuță',`go('llr','ortho','${type}','text')`)}${type!=='comp'?card('3. Transformă după model','Scrii doar grupul care se modifică',`go('llr','ortho','${type}','transform')`):''}${card(type==='comp'?'3. Detectivul greșelilor':'4. Detectivul greșelilor','Găsește enunțurile scrise corect',`go('llr','ortho','${type}','errors')`)}</div>`);let body='',data=DATA.ortho[type];if(exercise==='choose'){body=data.map(([sentence,answer],i)=>{let answers=answer.split('|');let pieces=sentence.split('___');return `<div class="task"><p><b>${i+1}.</b> ${pieces.map((p,j)=>esc(p)+(j<answers.length?` <select class="entry short" data-id="${i}_${j}" data-answer="${answers[j]}" onchange="setval('${i}_${j}',this.value)"><option value="">Alege</option>${opts[type].map(o=>`<option value="${o}" ${val(i+'_'+j)===o?'selected':''}>${o}</option>`).join('')}</select> `:'')).join('')}</p><button class="btn alt" onclick="hint('${i}')">💡 Ajutor</button><div id="hint${i}"></div></div>`}).join('')}else if(exercise==='text'){let [t,answers]=DATA.orthoTexts[type],parts=t.split('___');body=`<div class="task"><p style="line-height:2.8">${parts.map((p,i)=>esc(p)+(i<answers.length?` <select class="entry short" data-id="${i}" data-answer="${answers[i]}" onchange="setval('${i}',this.value)"><option value="">Alege</option>${opts[type].map(o=>`<option ${val(i)===o?'selected':''}>${o}</option>`).join('')}</select> `:'')).join('')}</p></div>`}else if(exercise==='transform'){body=DATA.transforms[type].map(([a,b,c,answer],i)=>`<div class="task"><p>${i+1}. ${a} <b>${b}</b> ${c}</p><div class="row">${a} ${input(i,answer,'Scrie doar schimbarea')} ${c}</div></div>`).join('')}else{body=DATA.errors[type].map(([sentence,ok],i)=>`<div class="task"><p>${i+1}. ${esc(sentence)}</p><div class="options">${[['Corect','da'],['Greșit','nu']].map(([label,v])=>`<button class="option ${val(i)===v?'chosen':''}" onclick="choose('${i}','${v}')">${label}</button>`).join('')}</div><input type="hidden" data-id="${i}" data-answer="${ok?'da':'nu'}" value="${val(i)}"></div>`).join('')}view(`<div class="hero"><div class="section-label">${orthoNames[type]}</div><h2>${{choose:'Alege forma corectă',text:'Completează textul',transform:'Transformă după model',errors:'Detectivul greșelilor'}[exercise]}</h2><button class="btn alt" onclick="hint('general')">💡 Ajutor</button><div id="hintgeneral"></div></div><div class="panel">${body}${actions()}</div>`)}function hint(i){let el=$('#hint'+i);if(el)el.innerHTML=el.innerHTML?'':`<div class="hint">${rules[route[2]]} Indiciu: încearcă înlocuirea cu „ori”, „lui” sau „ei”, unde este posibil.</div>`}
function renderPunct(level,idx){if(!level)return view(`<div class="hero"><h2>💬 Semne de punctuație</h2><p>Lucrăm direct pe text. Nu trebuie să rescrii nimic.</p></div><div class="cards">${card('🧩 Nivel simplu: Pune semnele corect','Alege semnul pentru fiecare căsuță','go("llr","punct","easy")')}${card('🩹 Nivel dificil: Vindecă-te de virgulită!','Taie semnele adăugate în plus, păstrează-le pe cele corecte','go("llr","punct","hard")')}</div>`);if(idx===undefined)return view(`<div class="hero"><h2>${level==='easy'?'🧩 Pune semnele corect':'🩹 Vindecă-te de virgulită!'}</h2><p>${level==='easy'?'Completează toate căsuțele.':'Apasă pe semnele inutile pentru a le tăia.'}</p></div><div class="cards">${DATA.punct.map(([name],i)=>card(`${i+1}. ${name}`,'Text din fișa de punctuație',`go('llr','punct','${level}','${i}')`)).join('')}</div>`);let [name,raw]=DATA.punct[+idx];let segments=raw.split(/\{([.,?!:—])\}/g),count=0,parts='';let extras=0;let words=0;for(let j=0;j<segments.length;j++){if(j%2===1){let mark=segments[j],id='p'+count++;if(level==='easy'){parts+=`<button class="slot ${val(id)?'filled':''}" onclick="fillPunct('${id}')" data-id="${id}" data-answer="${mark}" data-value="${esc(val(id))}" aria-label="Alege semnul de punctuație">${val(id)||'□'}</button>`}else{parts+=`<button class="punct ${val(id)==='cut'?'cut':''}" onclick="cutPunct('${id}')" data-id="${id}" data-answer="keep" data-value="${val(id)==='cut'?'cut':'keep'}" aria-label="Păstrează sau taie semnul">${mark}</button>`}}else{let text=segments[j];if(level==='hard'){let chunks=text.split(/(\s+)/);text=chunks.map((word,k)=>{if(!word.trim()||word==='\n')return esc(word);let result=esc(word);words++;if(words%7===3 && !/[.,?!:—]$/.test(word.trim())){let id='x'+extras++;result+=`<button class="punct ${val(id)==='cut'?'cut':''}" onclick="cutPunct('${id}')" data-id="${id}" data-answer="cut" data-value="${val(id)==='cut'?'cut':'keep'}" aria-label="Păstrează sau taie semnul">${words%2?',':'.'}</button>`}return result}).join('')}else text=esc(text);parts+=text}}
let toolbar=level==='easy'?`<div class="toolbar"><span class="muted">Semnul ales:</span>${['.',',','?','!',':','—'].map(m=>`<button class="tool ${state.tool===m?'active':''}" onclick="setTool('${m}')">${m}</button>`).join('')}<button class="tool" onclick="setTool('')">Șterge</button></div><p class="notice">Alege un semn de mai sus, apoi apasă pe căsuța din text.</p>`:`<p class="notice">Unele semne sunt corecte. Apasă doar pe cele care nu au ce căuta acolo. Apasă din nou pentru a anula tăierea.</p>`;
view(`<div class="hero"><div class="section-label">${level==='easy'?'Nivel simplu':'Nivel dificil'}</div><h2>${esc(name)}</h2></div><div class="panel">${toolbar}<div class="punct-text">${parts}</div>${actions()}</div>`)}function setTool(m){state.tool=m;saveProgress();document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('active',x.textContent===m))}function fillPunct(id){diplomaReadyFor='';if(!state.tool){alert('Alege mai întâi semnul din bara de sus.');return}state[key(id)]=state.tool;saveProgress();let el=document.querySelector(`[data-id="${id}"]`);el.textContent=state.tool||'□';el.dataset.value=state.tool;el.classList.toggle('filled',!!state.tool);el.classList.remove('good','bad');$('#score').innerHTML=''}function cutPunct(id){diplomaReadyFor='';state[key(id)]=val(id)==='cut'?'keep':'cut';saveProgress();let el=document.querySelector(`[data-id="${id}"]`);el.classList.toggle('cut',val(id)==='cut');el.dataset.value=val(id);el.classList.remove('good','bad');$('#score').innerHTML=''}

function scienceData(i){try{return JSON.parse(localStorage.getItem('curajosilor-science-'+i))||{}}catch(e){return {}}}
function scienceSet(i,k,v){let d=scienceData(i);if(k.startsWith('obs')&&!d.initialPrediction&&d.prediction)d.initialPrediction=d.prediction;d[k]=v;try{localStorage.setItem('curajosilor-science-'+i,JSON.stringify(d))}catch(e){}}
function sciencePick(i,k,v){scienceSet(i,k,v);renderScience(String(i))}
function scienceField(i,k,label,value='',rows=3){return `<label class="science-label">${esc(label)}<textarea class="science-area" rows="${rows}" oninput="scienceSet(${i},'${k}',this.value)">${esc(value)}</textarea></label>`}
function renderScience(id){
 if(id===undefined)return view(`<div class="hero"><h2>🔬 Micul laborator de științe</h2><p>Pământul – mediu de viață. Formulează o predicție, experimentează, observă și explică!</p></div><div class="cards">${SCIENCE.map((e,i)=>card(`${i+1}. ${e.title}`,e.topic,`go('science','${i}')`)).join('')}</div>`);
 const i=Number(id),e=SCIENCE[i];if(!e)return view('<p>Experimentul nu a fost găsit.</p>');
 const d=scienceData(i);
 let prediction=e.items?`<div class="science-table"><table><thead><tr><th>Fruct / legumă</th><th>Predicția inițială</th><th>Rezultatul observat</th></tr></thead><tbody>${e.items.map((item,j)=>`<tr><td>${item}</td>${['pred','obs'].map(prefix=>`<td><div class="science-choices">${['Plutește','Se scufundă'].map(opt=>`<button type="button" class="option ${d[prefix+j]===opt?'chosen':''}" onclick="sciencePick(${i},'${prefix+j}','${opt}')">${opt}</button>`).join('')}</div></td>`).join('')}</tr>`).join('')}</tbody></table></div>`:scienceField(i,'prediction','Predicția mea – '+e.question,d.prediction||'');
 let obs=e.observations.map((q,j)=>scienceField(i,'obs'+j,q,d['obs'+j]||'',2)).join('');
 view(`<div class="hero"><div class="section-label">Experimentul ${i+1} · ${esc(e.topic)}</div><h2>🔬 ${esc(e.title)}</h2><p>Completează fișa pe măsură ce lucrezi. Răspunsurile se salvează automat pe acest dispozitiv.</p></div><div class="panel"><h3>Materiale necesare</h3><p>${esc(e.materials)}</p><h3>Cum lucrăm</h3><ol>${e.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><h3>1. Predicția mea</h3>${prediction}<h3>2. Rezultatele mele</h3>${obs}<h3>3. Concluzia mea</h3>${scienceField(i,'conclusion','Am descoperit că...',d.conclusion||'')}<div class="row"><button class="btn" onclick="scienceCertificate(${i})">🔬 Certificatul meu de mic cercetător (2 pagini)</button></div><p class="muted">Predicția inițială se păstrează în fișă, chiar dacă nu s-a confirmat. Certificatul se poate salva ca PDF din fereastra de imprimare.</p></div>`);
}
function scienceCertificate(i){
 const e=SCIENCE[i],d=scienceData(i);
 const complete=e.items?e.items.every((_,j)=>d['pred'+j]&&d['obs'+j]):!!(d.prediction||'').trim();
 if(!complete||!e.observations.every((_,j)=>(d['obs'+j]||'').trim())||!(d.conclusion||'').trim()){alert('Completează predicția, toate observațiile și concluzia înainte de a obține certificatul.');return}
 const name=(prompt('Cum te numești? Scrie prenumele și numele pentru certificat:')||'').trim();if(name.length<2)return;
 const date=new Intl.DateTimeFormat('ro-RO',{day:'numeric',month:'long',year:'numeric'}).format(new Date());
 const field=(title,value)=>`<section class="science-print-field"><b>${esc(title)}</b><p>${esc(value||'—').replace(/\n/g,'<br>')}</p></section>`;
 const prediction=e.items?`<table class="science-print-table"><thead><tr><th>Fruct / legumă</th><th>Predicția inițială</th><th>Rezultatul observat</th></tr></thead><tbody>${e.items.map((item,j)=>`<tr><td>${item}</td><td>${esc(d['pred'+j])}</td><td>${esc(d['obs'+j])}</td></tr>`).join('')}</tbody></table>`:field('Predicția inițială',d.initialPrediction||d.prediction);
 const result=e.observations.map((q,j)=>field(q,d['obs'+j])).join('');
 const sheet=`<article class="science-print-page science-award"><div class="science-award-icon">🔬 🌟 🔬</div><div class="science-brand">CLASA CURAJOȘILOR · MICUL LABORATOR DE ȘTIINȚE</div><h1>Certificat de mic cercetător</h1><p>Se acordă elevului / elevei</p><h2>${esc(name)}</h2><p>pentru realizarea experimentului</p><h3>„${esc(e.title)}”</h3><blockquote>„Încerc, observ, greșesc, înțeleg.<br>Așa învăț să descopăr lumea!”</blockquote><p>${esc(date)}</p></article><article class="science-print-page science-report"><div class="science-report-head"><span>🔬 MICUL LABORATOR DE ȘTIINȚE</span><span>FIȘA MEA DE EXPERIMENT</span></div><h2>Experimentul ${i+1}: ${esc(e.title)}</h2><p><b>Cercetător:</b> ${esc(name)} &nbsp; · &nbsp; <b>Data:</b> ${esc(date)}</p>${field('Materiale necesare',e.materials)}<h3>Predicția mea</h3>${prediction}<h3>Rezultate – Ce am observat?</h3>${result}<h3>Concluzia mea</h3>${field('Am descoperit că...',d.conclusion)}</article>`;
 document.getElementById('science-print').innerHTML=sheet;
 document.body.classList.add('science-printing');
 window.print();
}
window.addEventListener('afterprint',()=>document.body.classList.remove('science-printing'));
